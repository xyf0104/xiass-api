# =============================================================================
# XIASS API Docker Compose Configuration
# =============================================================================
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. docker-compose up -d
#   3. Check logs: docker-compose logs -f xiass-api
#   4. Access: http://localhost:8080
#
# All configuration is done via environment variables.
# No Setup Wizard needed - the system auto-initializes on first run.
# =============================================================================

services:
  # ===========================================================================
  # Watchtower (For Auto-Updates)
  # ===========================================================================
  watchtower:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: containrrr/watchtower:latest
    container_name: xiass-api-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --http-api-update xiass-api
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # Docker 29 rejects Watchtower's legacy default API v1.25.
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.40}
      - XIASS_WATCHTOWER_TOKEN=${XIASS_WATCHTOWER_TOKEN:-${NOWIND_WATCHTOWER_TOKEN:-sub2api-update-token}}
      - NOWIND_WATCHTOWER_TOKEN=${XIASS_WATCHTOWER_TOKEN:-${NOWIND_WATCHTOWER_TOKEN:-sub2api-update-token}}
      - WATCHTOWER_HTTP_API_TOKEN=${XIASS_WATCHTOWER_TOKEN:-${NOWIND_WATCHTOWER_TOKEN:-sub2api-update-token}}
    networks:
      - xiass-api-network

  # ===========================================================================
  # XIASS API Application
  # ===========================================================================
  xiass-api:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ghcr.io/xyf0104/xiass-api:latest
    container_name: xiass-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
      # Public authenticated SOCKS ports for OpenWrt/PassWall proxy nodes.
      # Keep this range aligned with the admin panel's "公网 SOCKS 端口起止".
      - "${BIND_HOST:-0.0.0.0}:${SOFT_ROUTER_PROXY_PUBLIC_PORT_RANGE:-1101-1120}:${SOFT_ROUTER_PROXY_PUBLIC_PORT_RANGE:-1101-1120}"
    volumes:
      # Data persistence (config.yaml will be auto-generated here)
      - sub2api_data:/app/data
      # Required by Admin -> Proxies -> 代理节点 to install/configure host frps.
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Mount custom config.yaml (uncomment and create the file first)
      # Copy config.example.yaml to config.yaml, modify it, then uncomment:
      # - ./config.yaml:/app/data/config.yaml
      # Optional: Mount a custom Codex instructions template file, then point
      # gateway.forced_codex_instructions_template_file at /app/data/codex-instructions.md.tmpl
      # in config.yaml.
      # - ./codex-instructions.md.tmpl:/app/data/codex-instructions.md.tmpl:ro
    extra_hosts:
      # Lets the container reach frps raw TCP ports listening on the Docker host.
      # In the proxy-node panel, set "XIASS API 内部访问地址" to host.docker.internal.
      - "host.docker.internal:host-gateway"
    environment:
      # =======================================================================
      # Auto Setup (REQUIRED for Docker deployment)
      # =======================================================================
      - AUTO_SETUP=true
      # Empty values preserve config.yaml settings and application defaults.
      - LOG_LEVEL=${LOG_LEVEL:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - LOG_SERVICE_NAME=${LOG_SERVICE_NAME:-}
      - LOG_ENV=${LOG_ENV:-}
      - LOG_CALLER=${LOG_CALLER:-}
      - LOG_STACKTRACE_LEVEL=${LOG_STACKTRACE_LEVEL:-}
      - LOG_OUTPUT_TO_STDOUT=${LOG_OUTPUT_TO_STDOUT:-}
      - LOG_OUTPUT_TO_FILE=${LOG_OUTPUT_TO_FILE:-}
      - LOG_OUTPUT_FILE_PATH=${LOG_OUTPUT_FILE_PATH:-}
      - LOG_ROTATION_MAX_SIZE_MB=${LOG_ROTATION_MAX_SIZE_MB:-}
      - LOG_ROTATION_MAX_BACKUPS=${LOG_ROTATION_MAX_BACKUPS:-}
      - LOG_ROTATION_MAX_AGE_DAYS=${LOG_ROTATION_MAX_AGE_DAYS:-}
      - LOG_ROTATION_COMPRESS=${LOG_ROTATION_COMPRESS:-}
      - LOG_ROTATION_LOCAL_TIME=${LOG_ROTATION_LOCAL_TIME:-}
      - LOG_SAMPLING_ENABLED=${LOG_SAMPLING_ENABLED:-}
      - LOG_SAMPLING_INITIAL=${LOG_SAMPLING_INITIAL:-}
      - LOG_SAMPLING_THEREAFTER=${LOG_SAMPLING_THEREAFTER:-}
      - CONFIG_FILE=${CONFIG_FILE:-}

      # =======================================================================
      # System Update Configuration
      # =======================================================================
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - UPDATE_GITHUB_TOKEN=${UPDATE_GITHUB_TOKEN:-}
      - XIASS_DEPLOYMENT_MODE=container
      - XIASS_WATCHTOWER_TOKEN=${XIASS_WATCHTOWER_TOKEN:-${NOWIND_WATCHTOWER_TOKEN:-sub2api-update-token}}
      - NOWIND_WATCHTOWER_TOKEN=${XIASS_WATCHTOWER_TOKEN:-${NOWIND_WATCHTOWER_TOKEN:-sub2api-update-token}}
      - XIASS_UPDATER_IMAGE=${XIASS_UPDATER_IMAGE:-ghcr.io/xyf0104/xiass-updater:latest}

      # =======================================================================
      # Server Configuration
      # =======================================================================
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - ENABLE_SERVER_TIMING=${ENABLE_SERVER_TIMING:-false}
      - RUN_MODE=${RUN_MODE:-standard}
      - SOFT_ROUTER_PROXY_PUBLIC_PORT_RANGE=${SOFT_ROUTER_PROXY_PUBLIC_PORT_RANGE:-1101-1120}
      - SOFT_ROUTER_PROXY_RAW_PORT_RANGE=${SOFT_ROUTER_PROXY_RAW_PORT_RANGE:-12083-12150}
      - ALIPAY_MOBILE_PRECREATE_DEEP_LINK=${ALIPAY_MOBILE_PRECREATE_DEEP_LINK:-}
      - TEAM_CHILD_MAIL_API_BASE=${TEAM_CHILD_MAIL_API_BASE:-}
      - TEAM_CHILD_MAIL_AUTH_MODE=${TEAM_CHILD_MAIL_AUTH_MODE:-none}
      - TEAM_CHILD_MAIL_API_KEY=${TEAM_CHILD_MAIL_API_KEY:-}
      - TEAM_CHILD_MAIL_CUSTOM_AUTH=${TEAM_CHILD_MAIL_CUSTOM_AUTH:-}
      - TEAM_CHILD_MAIL_DOMAIN=${TEAM_CHILD_MAIL_DOMAIN:-}
      - TEAM_CHILD_MAIL_CREATE_PATH=${TEAM_CHILD_MAIL_CREATE_PATH:-/api/new_address}
      - TEAM_CHILD_MAIL_MESSAGES_PATH=${TEAM_CHILD_MAIL_MESSAGES_PATH:-/api/mails}
      - TEAM_CHILD_MAIL_CONFIG_FILE=${TEAM_CHILD_MAIL_CONFIG_FILE:-/app/data/team-child-mail.env}
      - TEAM_CHILD_BROWSER_ENABLED=${TEAM_CHILD_BROWSER_ENABLED:-false}
      - TEAM_CHILD_BROWSER_UPSTREAM_URL=${TEAM_CHILD_BROWSER_UPSTREAM_URL:-https://team-child-browser:3001}
      - TEAM_CHILD_BROWSER_SESSION_TTL_MINUTES=${TEAM_CHILD_BROWSER_SESSION_TTL_MINUTES:-720}
      - TEAM_CHILD_BROWSER_TICKET_TTL_SECONDS=${TEAM_CHILD_BROWSER_TICKET_TTL_SECONDS:-180}
      - TEAM_CHILD_BROWSER_CONTROL_TTL_SECONDS=${TEAM_CHILD_BROWSER_CONTROL_TTL_SECONDS:-120}
      - TEAM_CHILD_AUTOMATION_URL=${TEAM_CHILD_AUTOMATION_URL:-http://team-child-browser:8090}
      - TEAM_CHILD_AUTOMATION_TOKEN=${TEAM_CHILD_AUTOMATION_TOKEN:-}
      - TEAM_CHILD_PROTECTED_MEMBER_EMAILS=${TEAM_CHILD_PROTECTED_MEMBER_EMAILS:-}

      # =======================================================================
      # Database Configuration (PostgreSQL)
      # =======================================================================
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      # =======================================================================
      # Redis Configuration
      # =======================================================================
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-}
      - REDIS_SENTINEL_MASTER_NAME=${REDIS_SENTINEL_MASTER_NAME:-}
      - REDIS_SENTINEL_USERNAME=${REDIS_SENTINEL_USERNAME:-}
      - REDIS_SENTINEL_PASSWORD=${REDIS_SENTINEL_PASSWORD:-}

      # =======================================================================
      # Admin Account (auto-created on first run)
      # =======================================================================
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@xiass.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - INACTIVE_USER_CLEANUP_ENABLED=${INACTIVE_USER_CLEANUP_ENABLED:-false}

      # =======================================================================
      # JWT Configuration
      # =======================================================================
      # IMPORTANT: Set a fixed JWT_SECRET to prevent login sessions from being
      # invalidated after container restarts. If left empty, a random secret
      # will be generated on each startup.
      # Generate a secure secret: openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-168}
      - JWT_REFRESH_TOKEN_STORE=${JWT_REFRESH_TOKEN_STORE:-redis}

      # Optional source-authoritative multi-node join tunnel. The target
      # application listens on loopback for PostgreSQL/Redis and forwards only
      # paired traffic to the source node over HTTPS WebSocket.
      - XIASS_CLUSTER_STATE_SOURCE_URL=${XIASS_CLUSTER_STATE_SOURCE_URL:-}
      - XIASS_CLUSTER_TUNNEL_TOKEN=${XIASS_CLUSTER_TUNNEL_TOKEN:-}
      - XIASS_CLUSTER_STATE_SOURCE_NODE_ID=${XIASS_CLUSTER_STATE_SOURCE_NODE_ID:-}
      - XIASS_CLUSTER_NODE_URLS_JSON=${XIASS_CLUSTER_NODE_URLS_JSON:-}

      # =======================================================================
      # Setup Configuration
      # =======================================================================
      - SETUP_MIGRATION_TIMEOUT_SECONDS=${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}

      # =======================================================================
      # TOTP (2FA) Configuration
      # =======================================================================
      # IMPORTANT: Set a fixed encryption key for TOTP secrets. If left empty,
      # a random key will be generated on each startup, causing all existing
      # TOTP configurations to become invalid (users won't be able to login
      # with 2FA).
      # Generate a secure key: openssl rand -hex 32
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}

      # =======================================================================
      # Timezone Configuration
      # This affects ALL time operations in the application:
      # - Database timestamps
      # - Usage statistics "today" boundary
      # - Subscription expiry times
      # - Log timestamps
      # Common values: Asia/Shanghai, America/New_York, Europe/London, UTC
      # =======================================================================
      - TZ=${TZ:-Asia/Shanghai}

      # =======================================================================
      # Gemini OAuth Configuration (for Gemini accounts)
      # =======================================================================
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}

      # Built-in OAuth client secrets (optional)
      # SECURITY: This repo does not embed third-party client_secret.
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_USER_AGENT_VERSION=${ANTIGRAVITY_USER_AGENT_VERSION:-}

      # =======================================================================
      # Security Configuration (URL Allowlist)
      # =======================================================================
      # Enable URL allowlist validation (false to skip allowlist checks)
      - SECURITY_URL_ALLOWLIST_ENABLED=${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      # Allow insecure HTTP URLs when allowlist is disabled (default: true; set to false to require https)
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}
      # Allow private IP addresses for upstream/pricing/CRS (default: true; set to false to block private hosts)
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}
      # Upstream hosts whitelist (comma-separated, only used when enabled=true)
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}

      # =======================================================================
      # Update Configuration (在线更新配置)
      # =======================================================================
      # Proxy for accessing GitHub (online updates + pricing data)
      # Examples: http://host:port, socks5://host:port
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}

      # =======================================================================
      # Gateway Upstream, Scheduling & Image Configuration
      # =======================================================================
      # Gateway values come from Compose .env or the shell.
      # Fallbacks mirror XIASS API backend defaults so omitted values preserve behavior.
      - GATEWAY_FORCE_CODEX_CLI=${GATEWAY_FORCE_CODEX_CLI:-false}
      - GATEWAY_OPENAI_COMPACT_MODEL=${GATEWAY_OPENAI_COMPACT_MODEL:-gpt-5.4}
      - GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT=${GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT:-0}
      - GATEWAY_OPENAI_WS_FORCE_HTTP=${GATEWAY_OPENAI_WS_FORCE_HTTP:-false}
      - GATEWAY_OPENAI_HTTP2_ENABLED=${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
      - GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1=${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD=${GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD:-2}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS:-600}
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_FAILURE_THRESHOLD=${GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_FAILURE_THRESHOLD:-2}
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_WINDOW_SECONDS=${GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_TTL_SECONDS=${GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_TTL_SECONDS:-600}
      - GATEWAY_MAX_BODY_SIZE=${GATEWAY_MAX_BODY_SIZE:-268435456}
      - GATEWAY_MAX_CONNS_PER_HOST=${GATEWAY_MAX_CONNS_PER_HOST:-1024}
      - GATEWAY_MAX_IDLE_CONNS=${GATEWAY_MAX_IDLE_CONNS:-2560}
      - GATEWAY_MAX_IDLE_CONNS_PER_HOST=${GATEWAY_MAX_IDLE_CONNS_PER_HOST:-120}
      - GATEWAY_SCHEDULING_STICKY_SESSION_MAX_WAITING=${GATEWAY_SCHEDULING_STICKY_SESSION_MAX_WAITING:-3}
      - GATEWAY_SCHEDULING_STICKY_SESSION_WAIT_TIMEOUT=${GATEWAY_SCHEDULING_STICKY_SESSION_WAIT_TIMEOUT:-120s}
      - GATEWAY_SCHEDULING_FALLBACK_WAIT_TIMEOUT=${GATEWAY_SCHEDULING_FALLBACK_WAIT_TIMEOUT:-30s}
      - GATEWAY_SCHEDULING_FALLBACK_MAX_WAITING=${GATEWAY_SCHEDULING_FALLBACK_MAX_WAITING:-100}
      - GATEWAY_SCHEDULING_LOAD_BATCH_ENABLED=${GATEWAY_SCHEDULING_LOAD_BATCH_ENABLED:-true}
      - GATEWAY_SCHEDULING_SLOT_CLEANUP_INTERVAL=${GATEWAY_SCHEDULING_SLOT_CLEANUP_INTERVAL:-30s}
      - GATEWAY_SCHEDULING_DB_FALLBACK_ENABLED=${GATEWAY_SCHEDULING_DB_FALLBACK_ENABLED:-true}
      - GATEWAY_SCHEDULING_DB_FALLBACK_TIMEOUT_SECONDS=${GATEWAY_SCHEDULING_DB_FALLBACK_TIMEOUT_SECONDS:-0}
      - GATEWAY_SCHEDULING_DB_FALLBACK_MAX_QPS=${GATEWAY_SCHEDULING_DB_FALLBACK_MAX_QPS:-0}
      - GATEWAY_SCHEDULING_OUTBOX_POLL_INTERVAL_SECONDS=${GATEWAY_SCHEDULING_OUTBOX_POLL_INTERVAL_SECONDS:-1}
      - GATEWAY_SCHEDULING_OUTBOX_LAG_WARN_SECONDS=${GATEWAY_SCHEDULING_OUTBOX_LAG_WARN_SECONDS:-5}
      - GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_SECONDS=${GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_SECONDS:-10}
      - GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_FAILURES=${GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_FAILURES:-3}
      - GATEWAY_SCHEDULING_OUTBOX_BACKLOG_REBUILD_ROWS=${GATEWAY_SCHEDULING_OUTBOX_BACKLOG_REBUILD_ROWS:-10000}
      - GATEWAY_SCHEDULING_FULL_REBUILD_INTERVAL_SECONDS=${GATEWAY_SCHEDULING_FULL_REBUILD_INTERVAL_SECONDS:-300}
      - GATEWAY_EXECUTION_NODE_ENABLED=${GATEWAY_EXECUTION_NODE_ENABLED:-false}
      - GATEWAY_EXECUTION_NODE_ID=${GATEWAY_EXECUTION_NODE_ID:-}
      - GATEWAY_EXECUTION_NODE_DEFAULT_PROXY_ID=${GATEWAY_EXECUTION_NODE_DEFAULT_PROXY_ID:-0}
      - GATEWAY_EXECUTION_NODE_EMERGENCY_LOCAL_EGRESS=${GATEWAY_EXECUTION_NODE_EMERGENCY_LOCAL_EGRESS:-true}
      - GATEWAY_EXECUTION_NODE_CONTROL_PLANE=${GATEWAY_EXECUTION_NODE_CONTROL_PLANE:-true}
      - GATEWAY_EXECUTION_NODE_LEGACY_UNASSIGNED_NODE_ID=${GATEWAY_EXECUTION_NODE_LEGACY_UNASSIGNED_NODE_ID:-api}
      - GATEWAY_EXECUTION_NODE_LEGACY_UNASSIGNED_PROXY_ID=${GATEWAY_EXECUTION_NODE_LEGACY_UNASSIGNED_PROXY_ID:-0}
      - GATEWAY_EXECUTION_NODE_WITNESS_ENABLED=${GATEWAY_EXECUTION_NODE_WITNESS_ENABLED:-false}
      - GATEWAY_EXECUTION_NODE_WITNESS_URL=${GATEWAY_EXECUTION_NODE_WITNESS_URL:-}
      - GATEWAY_EXECUTION_NODE_WITNESS_TOKEN=${GATEWAY_EXECUTION_NODE_WITNESS_TOKEN:-}
      - GATEWAY_EXECUTION_NODE_WITNESS_CLUSTER_ID=${GATEWAY_EXECUTION_NODE_WITNESS_CLUSTER_ID:-}
      - GATEWAY_EXECUTION_NODE_WITNESS_LEASE_TTL_SECONDS=${GATEWAY_EXECUTION_NODE_WITNESS_LEASE_TTL_SECONDS:-15}
      - GATEWAY_EXECUTION_NODE_WITNESS_REQUEST_TIMEOUT_SECONDS=${GATEWAY_EXECUTION_NODE_WITNESS_REQUEST_TIMEOUT_SECONDS:-3}
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_NONSTREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_NONSTREAM_KEEPALIVE_INTERVAL:-0}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xiass-api-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # A persistent, visible Chromium desktop for the Team child-account workflow.
  # It is reachable only from xiass-api through the same-origin browser proxy.
  # Start explicitly: docker compose --profile team-browser up -d
  team-child-browser:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: lscr.io/linuxserver/chromium:latest
    container_name: xiass-api-team-child-browser
    restart: unless-stopped
    profiles: ["team-browser"]
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    environment:
      - PUID=${TEAM_CHILD_BROWSER_PUID:-1000}
      - PGID=${TEAM_CHILD_BROWSER_PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - SUBFOLDER=/api/v1/team-child-browser/
      - CHROME_CLI=--remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding ${TEAM_CHILD_BROWSER_START_URL:-https://chatgpt.com/admin/members}
      - TITLE=XIASS Team Browser
      - START_DOCKER=false
      - HARDEN_DESKTOP=true
      - HARDEN_OPENBOX=true
      - RESTART_APP=true
      - NO_DECOR=true
    volumes:
      - team_child_browser_data:/config
    networks:
      - xiass-api-network

  # Same-origin module operations for the persistent Chromium profile.
  # This service has no published host port and is only reachable by XIASS.
  team-child-automation:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ${TEAM_CHILD_AUTOMATION_IMAGE:-ghcr.io/xyf0104/xiass-team-child-automation:latest}
    build:
      context: ./team-child-automation
    container_name: xiass-api-team-child-automation
    restart: unless-stopped
    profiles: ["team-browser"]
    environment:
      - BROWSER_CDP_URL=http://127.0.0.1:9222
      - MEMBERS_URL=${TEAM_CHILD_BROWSER_START_URL:-https://chatgpt.com/admin/members}
      - TEAM_CHILD_AUTOMATION_TOKEN=${TEAM_CHILD_AUTOMATION_TOKEN:-}
      - TEAM_CHILD_PROTECTED_MEMBER_EMAILS=${TEAM_CHILD_PROTECTED_MEMBER_EMAILS:-}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - team_child_automation_data:/app/data
    depends_on:
      team-child-browser:
        condition: service_started
    network_mode: "service:team-child-browser"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/readyz').then(async (response) => process.exit(response.ok && response.headers.get('x-xiass-team-child-protocol') === '4' && (await response.json()).workflow_schema_version === 4 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:18-alpine
    container_name: xiass-api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    # Pass the tuning values documented in .env.example to postgres. The
    # fallbacks are the postgres:18 stock defaults, so nothing changes when
    # the variables are not set.
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # postgres:18-alpine 默认 PGDATA=/var/lib/postgresql/18/docker（位于镜像声明的匿名卷 /var/lib/postgresql 内）。
      # 若不显式设置 PGDATA，则即使挂载了 postgres_data 到 /var/lib/postgresql/data，数据也不会落盘到该命名卷，
      # docker compose down/up 后会触发 initdb 重新初始化，导致用户/密码等数据丢失。
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - xiass-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api} && psql -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api} -Atqc 'SELECT 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    # 注意：不暴露端口到宿主机，应用通过内部网络连接
    # 如需调试，可临时添加：ports: ["127.0.0.1:5433:5432"]

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:8-alpine
    container_name: xiass-api-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - redis_data:/data
    # The command is one quoted script for the inner `sh -c`. Compose keeps
    # the newlines inside the quoted string, so every line needs a trailing
    # `\` — without it, `redis-server` on the first line runs with no flags
    # at all, and the --save/--appendonly/--appendfsync lines are never read.
    command: >
      sh -c '
        redis-server \
        --save 60 1 \
        --appendonly yes \
        --appendfsync everysec \
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # REDISCLI_AUTH is used by redis-cli for authentication (safer than -a flag)
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - xiass-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # 注意：不暴露端口到宿主机，应用通过内部网络连接
    # 如需调试，可临时添加：ports: ["127.0.0.1:6379:6379"]
# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Historical key: changing it would orphan existing deploy_sub2api_data volumes.
  sub2api_data:
    driver: local
  team_child_browser_data:
    driver: local
  team_child_automation_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  xiass-api-network:
    driver: bridge
