services:
  witness:
    image: ghcr.io/xyf0104/xiass-witness:latest
    container_name: xiass-witness
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      XIASS_WITNESS_LISTEN: 0.0.0.0:8091
      XIASS_WITNESS_DATA: /var/lib/xiass-witness/witness.db
      XIASS_WITNESS_TOKEN: ${XIASS_WITNESS_TOKEN:?XIASS_WITNESS_TOKEN is required}
    ports:
      - 127.0.0.1:${XIASS_WITNESS_PORT:-8091}:8091
    volumes:
      - xiass_witness_data:/var/lib/xiass-witness

volumes:
  xiass_witness_data:
    name: xiass_witness_data
