name: Retag stable rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest tags to v1.2.9 artifacts
        run: |
          docker buildx imagetools create --tag ghcr.io/xyf0104/xiass-api:latest ghcr.io/xyf0104/xiass-api:1.2.9
          docker buildx imagetools create --tag ghcr.io/xyf0104/xiass-team-child-automation:latest ghcr.io/xyf0104/xiass-team-child-automation:v1.2.9
          docker buildx imagetools create --tag ghcr.io/xyf0104/xiass-updater:latest ghcr.io/xyf0104/xiass-updater:v1.2.9
