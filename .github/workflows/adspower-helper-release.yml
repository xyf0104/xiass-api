name: AdsPower Helper Release

on:
  push:
    branches:
      - main
    paths:
      - 'tools/xiass-adspower-helper/**'
      - '.github/workflows/adspower-helper-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adspower-helper-release
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/xiass-adspower-helper/go.mod
          cache-dependency-path: tools/xiass-adspower-helper/go.sum

      - name: Build universal macOS helper
        working-directory: tools/xiass-adspower-helper
        run: |
          go test ./...
          ./build-macos-app.sh

      - name: Upload macOS helper
        uses: actions/upload-artifact@v4
        with:
          name: xiass-adspower-helper-macos
          path: |
            tools/xiass-adspower-helper/build/xiass-adspower-helper-macos-universal.dmg
            tools/xiass-adspower-helper/build/xiass-adspower-helper-macos-universal.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/xiass-adspower-helper/go.mod
          cache-dependency-path: tools/xiass-adspower-helper/go.sum

      - name: Build Windows helper
        working-directory: tools/xiass-adspower-helper
        shell: pwsh
        run: |
          go test ./...
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/xiass-adspower-helper-windows-x64.exe .

      - name: Upload Windows helper
        uses: actions/upload-artifact@v4
        with:
          name: xiass-adspower-helper-windows
          path: tools/xiass-adspower-helper/build/xiass-adspower-helper-windows-x64.exe
          retention-days: 1

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download helper assets
        uses: actions/download-artifact@v4
        with:
          pattern: xiass-adspower-helper-*
          path: helper-assets
          merge-multiple: true

      - name: Publish fixed helper downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(tr -d '\r\n' < tools/xiass-adspower-helper/VERSION)
          TAG="adspower-helper-latest"
          TITLE="XIASS AdsPower 助手 v${VERSION}"
          NOTES="XIASS 授权助手。macOS 提供可安装 DMG 和菜单栏应用，登录后后台常驻，息屏继续接收任务；已配对电脑可接收手机或其他设备发起的 AdsPower 授权。最多并行处理 3 个账号，每个账号固定独立 Profile、Cookie 与会话，52 个 Mac 指纹配置槽循环使用并关闭 WebRTC。所有 AdsPower 密钥、代理凭据、Cookie 与 OAuth Token 仅保存在管理员电脑。"
          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" helper-assets/xiass-adspower-helper-macos-universal.dmg helper-assets/xiass-adspower-helper-macos-universal.zip helper-assets/xiass-adspower-helper-windows-x64.exe --clobber
          ASSETS=$(gh release view "$TAG" --json assets --jq '[.assets[].name]')
          echo "$ASSETS" | grep -q 'xiass-adspower-helper-macos-universal.dmg'
          echo "$ASSETS" | grep -q 'xiass-adspower-helper-macos-universal.zip'
          echo "$ASSETS" | grep -q 'xiass-adspower-helper-windows-x64.exe'
          PRERELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')
          test "$PRERELEASE" = "true"
