name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify XIASS release contract
        run: python3 tools/check_release_contract.py

  update-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify legacy origin migration
        run: |
          bash -n deploy/xiass-update.sh
          bash -n deploy/xiass-runtime-export.sh
          bash -n deploy/xiass-runtime-restore.sh
          bash -n deploy/xiass-cluster-join.sh
          bash -n deploy/xiass-cluster-runtime.sh
          bash -n deploy/install.sh
          bash -n deploy/docker-deploy.sh
          tools/test_xiass_update_origin.sh
          tools/test_xiass_update_browser_profile_migration.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          bash -n deploy/tests/docker-entrypoint-socket-group-test.sh
          bash deploy/tests/docker-entrypoint-socket-group-test.sh
          bash deploy/tests/update-script-portability-test.sh
          bash deploy/tests/runtime-export-scripts-test.sh
          bash deploy/tests/execution-node-runtime-scripts-test.sh
          bash deploy/test-install-download-integrity.sh
          bash deploy/tests/install-github-token-test.sh
          bash deploy/test-docker-deploy-existing-install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
